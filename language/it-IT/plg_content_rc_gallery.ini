PLG_CONTENT_RC_GALLERY_DESCRIPTION="Grazie per aver installato RC Gallery, un plugin galleria a larghezza fissa, facile da usare per Joomla. Assicurati di dare un'occhiata ai componenti aggiuntivi disponibili."

