; Fieldset base - Avvio rapido
PLG_CONTENT_RC_GALLERY_QUICKSTART_LABEL="Istruzioni di avvio rapido"
PLG_CONTENT_RC_GALLERY_WITHEDITORBUTTON_LABEL="Con il componente pulsante editor:"
PLG_CONTENT_RC_GALLERY_WITHEDITORBUTTON_DESC="1. Fare clic sul pulsante &quot;RC Gallery&quot; nell'editor degli articoli. 2. Selezionare le opzioni. 3. Fare clic su &quot;inserisci&quot;. Ecco fatto!"
PLG_CONTENT_RC_GALLERY_WITHOUTEDITORBUTTON_LABEL="Metodo manuale:"
PLG_CONTENT_RC_GALLERY_WITHOUTEDITORBUTTON_DESC="Se preferite non usare il pulsante dell'editor, potete aggiungere gallerie ai vostri articoli semplicemente includendo il testo &quot;{gallery}miacartella{/gallery}&quot;, senza virgolette, in qualsiasi punto del vostro articolo. Per impostazione predefinita, questo includer&agrave; le immagini dalla cartella &quot;vostrositojoomla.com/images/miacartella&quot;."
PLG_CONTENT_RC_GALLERY_MOREINSTRUCTIONS_LABEL="Maggiori informazioni"
PLG_CONTENT_RC_GALLERY_MOREINSTRUCTIONS_DESC="Naturalmente avete molto pi&ugrave; controllo sul plugin se lo desiderate. Il manuale completo &egrave; disponibile su http://www.therichcourt.com/joomla/gallery/download"

; Fieldset Galleria
PLG_CONTENT_RC_GALLERY_GALLERYDESCRIPTION_LABEL="Galleria"
PLG_CONTENT_RC_GALLERY_GALLERYFOLDER_LABEL="Cartella radice delle immagini"
PLG_CONTENT_RC_GALLERY_GALLERYFOLDER_DESC="Scegli la cartella principale che contiene le cartelle che desideri utilizzare per le tue gallerie."
PLG_CONTENT_RC_GALLERY_LAYOUT_LABEL="Layout"
PLG_CONTENT_RC_GALLERY_LAYOUT_DESC="Puoi ottenere pi&ugrave; layout scaricando il componente aggiuntivo dei layout"
PLG_CONTENT_RC_GALLERY_SORTTYPE_LABEL="Ordina immagini per"
PLG_CONTENT_RC_GALLERY_SORTTYPE_DESC="Ordina le immagini per nome file o data. Nota che la data richiede che l'immagine abbia una data nei dati EXIF del file."
PLG_CONTENT_RC_GALLERY_SORTTYPE_OPT_FILENAME="Nome file"
PLG_CONTENT_RC_GALLERY_SORTTYPE_OPT_DATE="Data"
PLG_CONTENT_RC_GALLERY_SORTTYPE_OPT_RANDOM="Casuale (diverso ogni volta che la pagina viene caricata)"
PLG_CONTENT_RC_GALLERY_SORTDESC_LABEL="Direzione di ordinamento"
PLG_CONTENT_RC_GALLERY_SORTDESC_DESC="Ordina le immagini in ordine crescente o decrescente."
PLG_CONTENT_RC_GALLERY_SORTDESC_OPT_ASCENDING="Crescente"
PLG_CONTENT_RC_GALLERY_SORTDESC_OPT_DESCENDING="Decrescente"
PLG_CONTENT_RC_GALLERY_MINROWHEIGHT_LABEL="Altezza riga obiettivo"
PLG_CONTENT_RC_GALLERY_MINROWHEIGHT_DESC="L'altezza delle righe varia a seconda della forma delle immagini incluse, ma mirer&agrave; ad avvicinarsi al numero inserito qui."
PLG_CONTENT_RC_GALLERY_THUMBQUALITY_LABEL="Qualit&agrave; miniature (0 - 100)"
PLG_CONTENT_RC_GALLERY_THUMBQUALITY_DESC="Qualit&agrave; dell'immagine per le miniature. 100 offre la massima qualit&agrave; possibile, ma una dimensione file maggiore. Riduci questo valore per diminuire la dimensione dei file delle miniature. Nota che puoi ricreare le miniature eliminandole tramite il tuo client FTP o il Gestore Media di Joomla. Consulta la guida utente di RC Gallery, disponibile su therichcourt.com per maggiori informazioni."
PLG_CONTENT_RC_GALLERY_IMAGEMARGIN_LABEL="Dimensione margine immagine"
PLG_CONTENT_RC_GALLERY_IMAGEMARGIN_DESC="Dimensione dei margini dell'immagine, in px."
PLG_CONTENT_RC_GALLERY_IMAGETITLE_LABEL="Titolo immagine"
PLG_CONTENT_RC_GALLERY_IMAGETITLE_DESC="Mostra il nome del file dell'immagine sopra l'immagine. Nota che l'estensione del file non viene mostrata, i trattini bassi vengono sostituiti con spazi e la prima lettera viene forzata in maiuscolo."
PLG_CONTENT_RC_GALLERY_IMAGETITLE_OPT_HIDE="Non mostrare i titoli delle immagini"
PLG_CONTENT_RC_GALLERY_IMAGETITLE_OPT_HOVER="Mostra i titoli solo al passaggio del cursore sull'immagine"
PLG_CONTENT_RC_GALLERY_IMAGETITLE_OPT_ALWAYS="Mostra i titoli sempre"
PLG_CONTENT_RC_GALLERY_USETITLEASALT_LABEL="Usa titolo immagine come attributo 'alt'"
PLG_CONTENT_RC_GALLERY_USETITLEASALT_DESC="Utilizza il titolo dell'immagine come attributo 'alt' per la miniatura. Questo &egrave; utile se le immagini hanno titoli descrittivi, ma se sono qualcosa come 'DSC00023.JPG', &egrave; meno utile e potresti voler disattivare questa opzione. Puoi personalizzare i titoli delle immagini se i nomi dei file non sono descrittivi. Consulta la guida per i dettagli. Nel complesso, questa funzione &egrave; buona per il SEO e l'accessibilit&agrave;, ma solo se hai buoni titoli per le immagini."
PLG_CONTENT_RC_GALLERY_USELABELSFILE_LABEL="Ottieni titoli da file di etichette"
PLG_CONTENT_RC_GALLERY_USELABELSFILE_DESC="Funzione avanzata - consulta la guida utente su www.TheRichCourt.com"

; Fieldset Shadowbox
PLG_CONTENT_RC_GALLERY_SHADOWBOXDESCRIPTION_LABEL="Shadowbox"
PLG_CONTENT_RC_GALLERY_SHADOWBOXDESCRIPTION_DESC="Scegli quale tipo di shadowbox utilizzare. Se ne hai gi&agrave; uno che ti piace, puoi usarlo selezionando 'Usa un altro shadowbox'. Questo aggiunger&agrave; link rel='shadowbox[rc_gallery]' alle immagini, ma non includer&agrave; la parte shadowbox di questo plugin, permettendo al tuo shadowbox di prendere il controllo. Questa opzione &egrave; utile per evitare conflitti con il tuo plugin shadowbox esistente."
PLG_CONTENT_RC_GALLERY_SHADOWBOXOPTION_LABEL="Shadowbox"
PLG_CONTENT_RC_GALLERY_SHADOWBOXOPTION_DESC="Seleziona il tipo di shadowbox da utilizzare con la galleria."
PLG_CONTENT_RC_GALLERY_SHADOWBOXOPTION_OPT_BUILTIN="Usa il shadowbox integrato (Consigliato)"
PLG_CONTENT_RC_GALLERY_SHADOWBOXOPTION_OPT_LEGACY="Usa il shadowbox legacy"
PLG_CONTENT_RC_GALLERY_SHADOWBOXOPTION_OPT_ANOTHER="Usa un altro shadowbox"
PLG_CONTENT_RC_GALLERY_SHADOWBOXOPTION_OPT_NONE="Nessun shadowbox"
PLG_CONTENT_RC_GALLERY_HIDESCROLLBAR_LABEL="Impedisci lo scorrimento"
PLG_CONTENT_RC_GALLERY_HIDESCROLLBAR_DESC="Potresti voler impedire lo scorrimento della pagina mentre il shadowbox &egrave; aperto. Questo nasconde la barra di scorrimento, che in alcuni browser fa s&igrave; che il contenuto diventi leggermente pi&ugrave; largo e sembri spostarsi a sinistra e a destra."
PLG_CONTENT_RC_GALLERY_HIDESCROLLBAR_OPT_ALLOW="Consenti lo scorrimento"
PLG_CONTENT_RC_GALLERY_HIDESCROLLBAR_OPT_PREVENT="Impedisci lo scorrimento (nasconde la barra di scorrimento, potrebbe causare spostamenti del contenuto)"
PLG_CONTENT_RC_GALLERY_SHADOWBOXANIMATIONS_LABEL="Animazioni di transizione"
PLG_CONTENT_RC_GALLERY_SHADOWBOXANIMATIONS_DESC="Scegli il tipo di animazione di transizione quando si passa tra le immagini nel shadowbox (non si applica al shadowbox legacy)"

; Fieldset Aspetto - Miniature della galleria
PLG_CONTENT_RC_GALLERY_THUMBNAILS_NOTE_LABEL="Miniature della galleria"
PLG_CONTENT_RC_GALLERY_THUMBNAILS_NOTE_DESC="Personalizza alcuni elementi per adattarli al tuo sito."
PLG_CONTENT_RC_GALLERY_THUMBBGCOLOUR_LABEL="Colore di sfondo delle miniature"
PLG_CONTENT_RC_GALLERY_THUMBBGCOLOUR_DESC="Il colore delle miniature delle immagini durante il caricamento delle immagini."
PLG_CONTENT_RC_GALLERY_TITLETEXTCOLOUR_LABEL="Colore del titolo dell'immagine"
PLG_CONTENT_RC_GALLERY_TITLETEXTCOLOUR_DESC="Il colore dei titoli delle immagini (nota che i titoli delle immagini devono essere attivati nelle impostazioni della galleria perch&eacute; questo si applichi)."
PLG_CONTENT_RC_GALLERY_TITLETEXTSIZE_LABEL="Dimensione del testo del titolo (px)"
PLG_CONTENT_RC_GALLERY_TITLETEXTSIZE_DESC="Imposta la dimensione del testo del titolo sulle miniature. 14px per impostazione predefinita."
PLG_CONTENT_RC_GALLERY_TITLETEXTWEIGHT_LABEL="Peso del testo del titolo"
PLG_CONTENT_RC_GALLERY_TITLETEXTWEIGHT_DESC="Peso del testo del titolo all'interno delle miniature."
PLG_CONTENT_RC_GALLERY_TITLETEXTWEIGHT_OPT_BOLD="Grassetto"
PLG_CONTENT_RC_GALLERY_TITLETEXTWEIGHT_OPT_NORMAL="Normale"
PLG_CONTENT_RC_GALLERY_TITLETEXTALIGN_LABEL="Allineamento del testo del titolo"
PLG_CONTENT_RC_GALLERY_TITLETEXTALIGN_DESC="Allinea il testo del titolo all'interno della miniatura dell'immagine. Nota che se l'overflow &egrave; impostato su nascosto e questa impostazione su centrato, il testo apparir&agrave; allineato a sinistra se &egrave; pi&ugrave; largo della miniatura."
PLG_CONTENT_RC_GALLERY_TITLETEXTOVERFLOW_LABEL="Overflow del testo del titolo"
PLG_CONTENT_RC_GALLERY_TITLETEXTOVERFLOW_DESC="Cosa fare se il testo del titolo &egrave; pi&ugrave; largo della miniatura."
PLG_CONTENT_RC_GALLERY_TITLETEXTOVERFLOW_OPT_HIDDEN="Nascosto"
PLG_CONTENT_RC_GALLERY_TITLETEXTOVERFLOW_OPT_AUTO="Automatico"
PLG_CONTENT_RC_GALLERY_THUMBNAILRADIUS_LABEL="Raggio degli angoli delle miniature (px)"
PLG_CONTENT_RC_GALLERY_THUMBNAILRADIUS_DESC="Arrotonda gli angoli delle miniature. 3px funziona molto bene per un aspetto pulito e moderno. Oppure usa un raggio enorme per miniature a forma di bolla. Inserisci 0 per angoli quadrati normali."
PLG_CONTENT_RC_GALLERY_THUMBNAILFILTER_LABEL="Filtro miniature"
PLG_CONTENT_RC_GALLERY_THUMBNAILFILTER_DESC="Applica un filtro alle miniature della tua galleria. Questo filtro viene rimosso con una transizione fluida quando il mouse passa sopra la miniatura, rivelando i veri colori. Nota che il filtro miniature funzioner&agrave; solo nei browser moderni (non Internet Explorer). Gli utenti IE vedranno le immagini a colori pieni."
PLG_CONTENT_RC_GALLERY_THUMBNAILFILTER_OPT_NONE="Nessun filtro"
PLG_CONTENT_RC_GALLERY_THUMBNAILFILTER_OPT_SEPIA="Seppia"
PLG_CONTENT_RC_GALLERY_THUMBNAILFILTER_OPT_GREYSCALE="Scala di grigi (Bianco e Nero)"

; Fieldset Aspetto - Shadowbox
PLG_CONTENT_RC_GALLERY_SHADOWBOX_APPEARANCE_NOTE_LABEL="Shadowbox"
PLG_CONTENT_RC_GALLERY_SHADOWBOX_APPEARANCE_NOTE_DESC="Le impostazioni seguenti si applicano solo se utilizzi il shadowbox integrato (attivato per impostazione predefinita)."
PLG_CONTENT_RC_GALLERY_SHADOWBOXTITLE_LABEL="Titoli delle immagini"
PLG_CONTENT_RC_GALLERY_SHADOWBOXTITLE_DESC="Mostra o nascondi i titoli delle immagini nel shadowbox. 'Nascondi automaticamente' fa apparire il titolo quando il mouse si muove e lo fa scomparire in caso di inattivit&agrave;."
PLG_CONTENT_RC_GALLERY_SHADOWBOXTITLE_OPT_SHOW="Mostra"
PLG_CONTENT_RC_GALLERY_SHADOWBOXTITLE_OPT_HIDE="Nascondi"
PLG_CONTENT_RC_GALLERY_OVERLAYCOLOUR_LABEL="Colore dell'overlay"
PLG_CONTENT_RC_GALLERY_OVERLAYCOLOUR_DESC="Il colore utilizzato per coprire il resto del sito quando il shadowbox &egrave; aperto. Nota che questo colore sar&agrave; influenzato dall'impostazione di opacit&agrave;."
PLG_CONTENT_RC_GALLERY_OVERLAYOPACITY_LABEL="Opacit&agrave; dell'overlay"
PLG_CONTENT_RC_GALLERY_OVERLAYOPACITY_DESC="L'opacit&agrave; del colore utilizzato per coprire il resto del sito quando il shadowbox &egrave; aperto."
PLG_CONTENT_RC_GALLERY_OVERLAYBLUR_LABEL="Raggio di sfocatura dell'overlay (px)"
PLG_CONTENT_RC_GALLERY_OVERLAYBLUR_DESC="Il raggio di sfocatura backdrop-filter in pixel. Nota che questa funzione non &egrave; supportata in tutti i browser, quindi in alcuni browser potresti non vedere alcuna sfocatura."

; Fieldset Componenti aggiuntivi
PLG_CONTENT_RC_GALLERY_ADDONSLINK_LABEL="Componenti aggiuntivi"
PLG_CONTENT_RC_GALLERY_ADDONSLINK_DESC="I componenti aggiuntivi sono un ottimo modo per estendere le funzionalit&agrave; del plugin galleria principale. Dai un'occhiata a ci&ograve; che &egrave; attualmente disponibile... http://therichcourt.com/joomla/gallery#add-ons"

; Fieldset Informazioni
PLG_CONTENT_RC_GALLERY_ABOUT_LABEL="RC Gallery"
PLG_CONTENT_RC_GALLERY_USERGUIDE_LABEL="Guida utente"
PLG_CONTENT_RC_GALLERY_USERGUIDE_DESC="Una guida utente gratuita e completa &egrave; disponibile per questo plugin su http://www.therichcourt.com/joomla/gallery/download"
PLG_CONTENT_RC_GALLERY_SUPPORT_LABEL="Supporto"
PLG_CONTENT_RC_GALLERY_SUPPORT_DESC="Se non riesci a trovare quello che ti serve, contattami per supporto su http://www.therichcourt.com/support"

; Fieldset Avanzate
PLG_CONTENT_RC_GALLERY_ADVANCED_NOTE_LABEL="Funzione avanzata"
PLG_CONTENT_RC_GALLERY_ADVANCED_NOTE_DESC="Se utilizzi gallerie grandi, la produzione di tutte le miniature pu&ograve; richiedere molto tempo. Questo accade solo la prima volta che una pagina viene visitata, tuttavia non &egrave; comunque ideale. In effetti, se hai abbastanza immagini, la richiesta HTTP scadr&agrave; mentre il tuo server sta ancora creando le miniature. Il risultato &egrave; che il visitatore vedr&agrave; un errore. Puoi aggirare questo problema in due modi diversi."
PLG_CONTENT_RC_GALLERY_ADVANCED_NOTE1_LABEL="1"
PLG_CONTENT_RC_GALLERY_ADVANCED_NOTE1_DESC="1. Ricarica la pagina alcune volte - ogni volta fa un po' pi&ugrave; di progressi, e dopo alcuni tentativi la pagina funzioner&agrave; sempre correttamente."
PLG_CONTENT_RC_GALLERY_ADVANCED_NOTE2_LABEL="2"
PLG_CONTENT_RC_GALLERY_ADVANCED_NOTE2_DESC="2. Attiva questa impostazione. Tuttavia, c'&egrave; anche un potenziale problema. Questa impostazione invier&agrave; una richiesta AJAX per ogni immagine, per produrre le miniature in modo asincrono. Tuttavia, alcuni server considereranno questo grande numero di richieste simili come un possibile attacco e le bloccheranno. Quindi, attiva questa opzione a tuo rischio! Se funziona sul tuo server, &egrave; decisamente l'opzione migliore."
PLG_CONTENT_RC_GALLERY_AJAXIMAGES_LABEL="Attiva immagini AJAX"
PLG_CONTENT_RC_GALLERY_AJAXIMAGES_DESC="Vedi nota sopra"

