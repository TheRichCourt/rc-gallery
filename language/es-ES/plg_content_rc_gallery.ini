PLG_CONTENT_RC_GALLERY_QUICKSTART_LABEL="Instrucciones de inicio r&aacute;pido"
PLG_CONTENT_RC_GALLERY_WITHEDITORBUTTON_LABEL="Con el complemento de bot&oacute;n del editor:"
PLG_CONTENT_RC_GALLERY_WITHEDITORBUTTON_DESC="1. Haga clic en el bot&oacute;n &quot;RC Gallery&quot; en el editor de art&iacute;culos. 2. Seleccione sus opciones. 3. Haga clic en &quot;insertar&quot;. &iexcl;Eso es todo!"
PLG_CONTENT_RC_GALLERY_WITHOUTEDITORBUTTON_LABEL="M&eacute;todo manual:"
PLG_CONTENT_RC_GALLERY_WITHOUTEDITORBUTTON_DESC="Si prefiere no usar el bot&oacute;n del editor, puede agregar galer&iacute;as a sus art&iacute;culos simplemente incluyendo el texto &quot;{gallery}micarpeta{/gallery}&quot;, sin las comillas, en cualquier parte de su art&iacute;culo. Por defecto, esto incluir&aacute; im&aacute;genes de la carpeta &quot;susitiojoomla.com/images/micarpeta&quot;."
PLG_CONTENT_RC_GALLERY_MOREINSTRUCTIONS_LABEL="M&aacute;s informaci&oacute;n"
PLG_CONTENT_RC_GALLERY_MOREINSTRUCTIONS_DESC="Por supuesto, tiene mucho m&aacute;s control sobre el plugin si lo desea. El manual completo est&aacute; disponible en http://www.therichcourt.com/joomla/gallery/download"

; Fieldset Galer&iacute;a
PLG_CONTENT_RC_GALLERY_GALLERYDESCRIPTION_LABEL="Galer&iacute;a"
PLG_CONTENT_RC_GALLERY_GALLERYFOLDER_LABEL="Carpeta ra&iacute;z de im&aacute;genes"
PLG_CONTENT_RC_GALLERY_GALLERYFOLDER_DESC="Elija la carpeta principal que contiene las carpetas que desea utilizar para sus galer&iacute;as."
PLG_CONTENT_RC_GALLERY_LAYOUT_LABEL="Dise&ntilde;o"
PLG_CONTENT_RC_GALLERY_LAYOUT_DESC="Puede obtener m&aacute;s dise&ntilde;os descargando el complemento de dise&ntilde;os"
PLG_CONTENT_RC_GALLERY_SORTTYPE_LABEL="Ordenar im&aacute;genes por"
PLG_CONTENT_RC_GALLERY_SORTTYPE_DESC="Ordenar im&aacute;genes por nombre de archivo o fecha. Tenga en cuenta que la fecha requiere que la imagen tenga una fecha en los datos EXIF del archivo."
PLG_CONTENT_RC_GALLERY_SORTTYPE_OPT_FILENAME="Nombre de archivo"
PLG_CONTENT_RC_GALLERY_SORTTYPE_OPT_DATE="Fecha"
PLG_CONTENT_RC_GALLERY_SORTTYPE_OPT_RANDOM="Aleatorio (diferente cada vez que se carga la p&aacute;gina)"
PLG_CONTENT_RC_GALLERY_SORTDESC_LABEL="Direcci&oacute;n de ordenamiento"
PLG_CONTENT_RC_GALLERY_SORTDESC_DESC="Ordenar im&aacute;genes en orden ascendente o descendente."
PLG_CONTENT_RC_GALLERY_SORTDESC_OPT_ASCENDING="Ascendente"
PLG_CONTENT_RC_GALLERY_SORTDESC_OPT_DESCENDING="Descendente"
PLG_CONTENT_RC_GALLERY_MINROWHEIGHT_LABEL="Altura objetivo de fila"
PLG_CONTENT_RC_GALLERY_MINROWHEIGHT_DESC="La altura de las filas var&iacute;a seg&uacute;n la forma de las im&aacute;genes incluidas, pero intentar&aacute; acercarse al n&uacute;mero ingresado aqu&iacute;."
PLG_CONTENT_RC_GALLERY_THUMBQUALITY_LABEL="Calidad de miniaturas (0 - 100)"
PLG_CONTENT_RC_GALLERY_THUMBQUALITY_DESC="Calidad de imagen para las miniaturas. 100 proporciona la m&aacute;xima calidad posible, pero un mayor tama&ntilde;o de archivo. Reduzca este valor para disminuir el tama&ntilde;o de las miniaturas. Tenga en cuenta que puede recrear las miniaturas elimin&aacute;ndolas mediante su cliente FTP o el Gestor de Medios de Joomla. Consulte la gu&iacute;a de usuario de RC Gallery, disponible en therichcourt.com para m&aacute;s informaci&oacute;n."
PLG_CONTENT_RC_GALLERY_IMAGEMARGIN_LABEL="Tama&ntilde;o del margen de imagen"
PLG_CONTENT_RC_GALLERY_IMAGEMARGIN_DESC="Tama&ntilde;o de los m&aacute;rgenes de imagen, en px."
PLG_CONTENT_RC_GALLERY_IMAGETITLE_LABEL="T&iacute;tulo de imagen"
PLG_CONTENT_RC_GALLERY_IMAGETITLE_DESC="Muestra el nombre del archivo de la imagen sobre la imagen. Tenga en cuenta que la extensi&oacute;n del archivo no se muestra, los guiones bajos se reemplazan por espacios y la primera letra se pone en may&uacute;scula."
PLG_CONTENT_RC_GALLERY_IMAGETITLE_OPT_HIDE="No mostrar t&iacute;tulos de im&aacute;genes"
PLG_CONTENT_RC_GALLERY_IMAGETITLE_OPT_HOVER="Mostrar t&iacute;tulos solo al pasar el cursor sobre la imagen"
PLG_CONTENT_RC_GALLERY_IMAGETITLE_OPT_ALWAYS="Mostrar t&iacute;tulos permanentemente"
PLG_CONTENT_RC_GALLERY_USETITLEASALT_LABEL="Usar t&iacute;tulo de imagen como atributo 'alt'"
PLG_CONTENT_RC_GALLERY_USETITLEASALT_DESC="Utiliza el t&iacute;tulo de la imagen como atributo 'alt' para la miniatura. Esto es &uacute;til si sus im&aacute;genes tienen t&iacute;tulos descriptivos, pero si son algo como 'DSC00023.JPG', es menos &uacute;til y puede que quiera desactivarlo. Puede personalizar los t&iacute;tulos de sus im&aacute;genes si los nombres de archivo no son descriptivos. Consulte la gu&iacute;a para m&aacute;s detalles. En general, esta funci&oacute;n es buena para el SEO y la accesibilidad, pero solo si tiene buenos t&iacute;tulos de im&aacute;genes."
PLG_CONTENT_RC_GALLERY_USELABELSFILE_LABEL="Obtener t&iacute;tulos desde archivo de etiquetas"
PLG_CONTENT_RC_GALLERY_USELABELSFILE_DESC="Funci&oacute;n avanzada - consulte la gu&iacute;a de usuario en www.TheRichCourt.com"

; Fieldset Shadowbox
PLG_CONTENT_RC_GALLERY_SHADOWBOXDESCRIPTION_LABEL="Shadowbox"
PLG_CONTENT_RC_GALLERY_SHADOWBOXDESCRIPTION_DESC="Elija qu&eacute; tipo de shadowbox usar. Si ya tiene uno que le gusta, puede usarlo seleccionando 'Usar otro shadowbox'. Esto agregar&aacute; enlaces rel='shadowbox[rc_gallery]' a las im&aacute;genes, pero no incluir&aacute; la parte shadowbox de este plugin, lo que permitir&aacute; que su propio shadowbox tome el control. Esta opci&oacute;n es &uacute;til para evitar conflictos con su plugin shadowbox existente."
PLG_CONTENT_RC_GALLERY_SHADOWBOXOPTION_LABEL="Shadowbox"
PLG_CONTENT_RC_GALLERY_SHADOWBOXOPTION_DESC="Seleccione el tipo de shadowbox a usar con la galer&iacute;a."
PLG_CONTENT_RC_GALLERY_SHADOWBOXOPTION_OPT_BUILTIN="Usar el shadowbox integrado (Recomendado)"
PLG_CONTENT_RC_GALLERY_SHADOWBOXOPTION_OPT_LEGACY="Usar el shadowbox antiguo"
PLG_CONTENT_RC_GALLERY_SHADOWBOXOPTION_OPT_ANOTHER="Usar otro shadowbox"
PLG_CONTENT_RC_GALLERY_SHADOWBOXOPTION_OPT_NONE="Sin shadowbox"
PLG_CONTENT_RC_GALLERY_HIDESCROLLBAR_LABEL="Impedir desplazamiento"
PLG_CONTENT_RC_GALLERY_HIDESCROLLBAR_DESC="Es posible que desee impedir el desplazamiento de la p&aacute;gina mientras el shadowbox est&aacute; abierto. Esto oculta la barra de desplazamiento, lo que en algunos navegadores hace que el contenido sea ligeramente m&aacute;s ancho y parezca desplazarse de izquierda a derecha."
PLG_CONTENT_RC_GALLERY_HIDESCROLLBAR_OPT_ALLOW="Permitir desplazamiento"
PLG_CONTENT_RC_GALLERY_HIDESCROLLBAR_OPT_PREVENT="Impedir desplazamiento (oculta la barra de desplazamiento, lo que puede causar desplazamiento del contenido)"
PLG_CONTENT_RC_GALLERY_SHADOWBOXANIMATIONS_LABEL="Animaciones de transici&oacute;n"
PLG_CONTENT_RC_GALLERY_SHADOWBOXANIMATIONS_DESC="Elija el tipo de animaci&oacute;n de transici&oacute;n al cambiar entre im&aacute;genes en el shadowbox (no se aplica al shadowbox antiguo)"

; Fieldset Apariencia - Miniaturas de la galer&iacute;a
PLG_CONTENT_RC_GALLERY_THUMBNAILS_NOTE_LABEL="Miniaturas de la galer&iacute;a"
PLG_CONTENT_RC_GALLERY_THUMBNAILS_NOTE_DESC="Personalice algunos elementos para adaptarlos a su sitio."
PLG_CONTENT_RC_GALLERY_THUMBBGCOLOUR_LABEL="Color de fondo de las miniaturas"
PLG_CONTENT_RC_GALLERY_THUMBBGCOLOUR_DESC="El color de las miniaturas de imagen mientras se cargan las im&aacute;genes."
PLG_CONTENT_RC_GALLERY_TITLETEXTCOLOUR_LABEL="Color del t&iacute;tulo de imagen"
PLG_CONTENT_RC_GALLERY_TITLETEXTCOLOUR_DESC="El color de los t&iacute;tulos de im&aacute;genes (tenga en cuenta que los t&iacute;tulos de imagen deben estar activados en la configuraci&oacute;n de la galer&iacute;a para que esto se aplique)."
PLG_CONTENT_RC_GALLERY_TITLETEXTSIZE_LABEL="Tama&ntilde;o del texto del t&iacute;tulo (px)"
PLG_CONTENT_RC_GALLERY_TITLETEXTSIZE_DESC="Establezca el tama&ntilde;o del texto del t&iacute;tulo sobre las miniaturas. 14px por defecto."
PLG_CONTENT_RC_GALLERY_TITLETEXTWEIGHT_LABEL="Grosor del texto del t&iacute;tulo"
PLG_CONTENT_RC_GALLERY_TITLETEXTWEIGHT_DESC="Grosor del texto del t&iacute;tulo dentro de las miniaturas."
PLG_CONTENT_RC_GALLERY_TITLETEXTWEIGHT_OPT_BOLD="Negrita"
PLG_CONTENT_RC_GALLERY_TITLETEXTWEIGHT_OPT_NORMAL="Normal"
PLG_CONTENT_RC_GALLERY_TITLETEXTALIGN_LABEL="Alineaci&oacute;n del texto del t&iacute;tulo"
PLG_CONTENT_RC_GALLERY_TITLETEXTALIGN_DESC="Alinee el texto del t&iacute;tulo dentro de la miniatura de imagen. Tenga en cuenta que si el desbordamiento est&aacute; configurado como oculto y esta configuraci&oacute;n en centrado, el texto parecer&aacute; alineado a la izquierda si es m&aacute;s ancho que la miniatura."
PLG_CONTENT_RC_GALLERY_TITLETEXTOVERFLOW_LABEL="Desbordamiento del texto del t&iacute;tulo"
PLG_CONTENT_RC_GALLERY_TITLETEXTOVERFLOW_DESC="Qu&eacute; hacer si el texto del t&iacute;tulo es m&aacute;s ancho que la miniatura."
PLG_CONTENT_RC_GALLERY_TITLETEXTOVERFLOW_OPT_HIDDEN="Oculto"
PLG_CONTENT_RC_GALLERY_TITLETEXTOVERFLOW_OPT_AUTO="Autom&aacute;tico"
PLG_CONTENT_RC_GALLERY_THUMBNAILRADIUS_LABEL="Radio de esquinas de miniaturas (px)"
PLG_CONTENT_RC_GALLERY_THUMBNAILRADIUS_DESC="Redondee las esquinas de las miniaturas. 3px funciona muy bien para un aspecto limpio y moderno. O use un radio enorme para miniaturas con forma de burbuja. Introduzca 0 para esquinas cuadradas normales."
PLG_CONTENT_RC_GALLERY_THUMBNAILFILTER_LABEL="Filtro de miniaturas"
PLG_CONTENT_RC_GALLERY_THUMBNAILFILTER_DESC="Aplique un filtro a las miniaturas de su galer&iacute;a. Este filtro se elimina con una transici&oacute;n suave cuando el rat&oacute;n pasa sobre la miniatura, revelando los colores verdaderos. Tenga en cuenta que el filtro de miniaturas solo funcionar&aacute; en navegadores modernos (no en Internet Explorer). Los usuarios de IE ver&aacute;n las im&aacute;genes a todo color."
PLG_CONTENT_RC_GALLERY_THUMBNAILFILTER_OPT_NONE="Sin filtro"
PLG_CONTENT_RC_GALLERY_THUMBNAILFILTER_OPT_SEPIA="Sepia"
PLG_CONTENT_RC_GALLERY_THUMBNAILFILTER_OPT_GREYSCALE="Escala de grises (Blanco y Negro)"

; Fieldset Apariencia - Shadowbox
PLG_CONTENT_RC_GALLERY_SHADOWBOX_APPEARANCE_NOTE_LABEL="Shadowbox"
PLG_CONTENT_RC_GALLERY_SHADOWBOX_APPEARANCE_NOTE_DESC="Los ajustes a continuaci&oacute;n solo se aplican si usa el shadowbox integrado (que est&aacute; activado por defecto)."
PLG_CONTENT_RC_GALLERY_SHADOWBOXTITLE_LABEL="T&iacute;tulos de im&aacute;genes"
PLG_CONTENT_RC_GALLERY_SHADOWBOXTITLE_DESC="Mostrar u ocultar los t&iacute;tulos de im&aacute;genes en el shadowbox. 'Auto-ocultar' hace que el t&iacute;tulo aparezca al mover el rat&oacute;n y desaparezca si no hay actividad."
PLG_CONTENT_RC_GALLERY_SHADOWBOXTITLE_OPT_SHOW="Mostrar"
PLG_CONTENT_RC_GALLERY_SHADOWBOXTITLE_OPT_HIDE="Ocultar"
PLG_CONTENT_RC_GALLERY_OVERLAYCOLOUR_LABEL="Color de la superposici&oacute;n"
PLG_CONTENT_RC_GALLERY_OVERLAYCOLOUR_DESC="El color utilizado para cubrir el resto del sitio cuando se abre el shadowbox. Tenga en cuenta que este color se ver&aacute; afectado por la configuraci&oacute;n de opacidad."
PLG_CONTENT_RC_GALLERY_OVERLAYOPACITY_LABEL="Opacidad de la superposici&oacute;n"
PLG_CONTENT_RC_GALLERY_OVERLAYOPACITY_DESC="La opacidad del color utilizado para cubrir el resto del sitio cuando se abre el shadowbox."
PLG_CONTENT_RC_GALLERY_OVERLAYBLUR_LABEL="Radio de desenfoque de la superposici&oacute;n (px)"
PLG_CONTENT_RC_GALLERY_OVERLAYBLUR_DESC="El radio de desenfoque backdrop-filter en p&iacute;xeles. Tenga en cuenta que esta funci&oacute;n no es compatible con todos los navegadores, por lo que en algunos navegadores es posible que no vea ning&uacute;n desenfoque."

