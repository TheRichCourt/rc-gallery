; Fieldset Avanzado
PLG_CONTENT_RC_GALLERY_ADVANCED_NOTE_LABEL="Funci&oacute;n avanzada"
PLG_CONTENT_RC_GALLERY_ADVANCED_NOTE_DESC="Si utiliza galer&iacute;as grandes, la producci&oacute;n de todas las miniaturas puede tardar mucho tiempo. Esto solo ocurre la primera vez que se visita una p&aacute;gina, pero a&uacute;n as&iacute; no es ideal. De hecho, si tiene suficientes im&aacute;genes, la solicitud HTTP expirar&aacute; mientras su servidor a&uacute;n est&aacute; creando las miniaturas. El resultado es que el visitante ver&aacute; un error. Puede evitar esto de dos maneras diferentes."
PLG_CONTENT_RC_GALLERY_ADVANCED_NOTE1_LABEL="1"
PLG_CONTENT_RC_GALLERY_ADVANCED_NOTE1_DESC="1. Recargue la p&aacute;gina varias veces - cada vez que lo haga, avanzar&aacute; un poco m&aacute;s, y despu&eacute;s de algunos intentos la p&aacute;gina siempre funcionar&aacute; correctamente."
PLG_CONTENT_RC_GALLERY_ADVANCED_NOTE2_LABEL="2"
PLG_CONTENT_RC_GALLERY_ADVANCED_NOTE2_DESC="2. Active esta configuraci&oacute;n. Sin embargo, tambi&eacute;n hay un problema potencial. Esta configuraci&oacute;n enviar&aacute; una solicitud AJAX para cada imagen, para producir las miniaturas de forma as&iacute;ncrona. Sin embargo, algunos servidores ver&aacute;n esta gran cantidad de solicitudes similares como un posible ataque y las bloquear&aacute;n. Por lo tanto, &iexcl;active esta opci&oacute;n bajo su propia responsabilidad! Si funciona en su servidor, es definitivamente la mejor opci&oacute;n."
PLG_CONTENT_RC_GALLERY_AJAXIMAGES_LABEL="Activar im&aacute;genes AJAX"
PLG_CONTENT_RC_GALLERY_AJAXIMAGES_DESC="Ver nota anterior"

