; Fieldset basic - D&eacute;marrage rapide
PLG_CONTENT_RC_GALLERY_QUICKSTART_LABEL="Instructions de d&eacute;marrage rapide"
PLG_CONTENT_RC_GALLERY_WITHEDITORBUTTON_LABEL="Avec le module bouton &eacute;diteur :"
PLG_CONTENT_RC_GALLERY_WITHEDITORBUTTON_DESC="1. Cliquez sur le bouton &quot;RC Gallery&quot; dans l'&eacute;diteur d'article. 2. S&eacute;lectionnez vos options. 3. Cliquez sur &quot;ins&eacute;rer&quot;. C'est tout !"
PLG_CONTENT_RC_GALLERY_WITHOUTEDITORBUTTON_LABEL="M&eacute;thode manuelle :"
PLG_CONTENT_RC_GALLERY_WITHOUTEDITORBUTTON_DESC="Si vous pr&eacute;f&eacute;rez ne pas utiliser le bouton &eacute;diteur, vous pouvez ajouter des galeries &agrave; vos articles en incluant simplement le texte &quot;{gallery}mondossier{/gallery}&quot;, sans les guillemets, n'importe o&ugrave; dans votre article. Par d&eacute;faut, cela inclura les images du dossier &quot;votresitejoomla.com/images/mondossier&quot;."
PLG_CONTENT_RC_GALLERY_MOREINSTRUCTIONS_LABEL="Plus d'informations"
PLG_CONTENT_RC_GALLERY_MOREINSTRUCTIONS_DESC="Bien s&ucirc;r, vous avez bien plus de contr&ocirc;le sur le plugin si vous le souhaitez. Le manuel complet est disponible sur http://www.therichcourt.com/joomla/gallery/download"

; Fieldset Galerie
PLG_CONTENT_RC_GALLERY_GALLERYDESCRIPTION_LABEL="Galerie"
PLG_CONTENT_RC_GALLERY_GALLERYFOLDER_LABEL="Dossier racine des images"
PLG_CONTENT_RC_GALLERY_GALLERYFOLDER_DESC="Choisissez le dossier parent contenant les dossiers que vous souhaitez utiliser pour vos galeries."
PLG_CONTENT_RC_GALLERY_LAYOUT_LABEL="Mise en page"
PLG_CONTENT_RC_GALLERY_LAYOUT_DESC="Vous pouvez obtenir plus de mises en page en t&eacute;l&eacute;chargeant le module compl&eacute;mentaire de mises en page"
PLG_CONTENT_RC_GALLERY_SORTTYPE_LABEL="Trier les images par"
PLG_CONTENT_RC_GALLERY_SORTTYPE_DESC="Trier les images par nom de fichier ou par date. Notez que le tri par date n&eacute;cessite que l'image contienne une date dans ses donn&eacute;es EXIF."
PLG_CONTENT_RC_GALLERY_SORTTYPE_OPT_FILENAME="Nom de fichier"
PLG_CONTENT_RC_GALLERY_SORTTYPE_OPT_DATE="Date"
PLG_CONTENT_RC_GALLERY_SORTTYPE_OPT_RANDOM="Al&eacute;atoire (diff&eacute;rent &agrave; chaque chargement de la page)"
PLG_CONTENT_RC_GALLERY_SORTDESC_LABEL="Ordre de tri"
PLG_CONTENT_RC_GALLERY_SORTDESC_DESC="Trier les images par ordre croissant ou d&eacute;croissant."
PLG_CONTENT_RC_GALLERY_SORTDESC_OPT_ASCENDING="Croissant"
PLG_CONTENT_RC_GALLERY_SORTDESC_OPT_DESCENDING="D&eacute;croissant"
PLG_CONTENT_RC_GALLERY_MINROWHEIGHT_LABEL="Hauteur cible des rang&eacute;es"
PLG_CONTENT_RC_GALLERY_MINROWHEIGHT_DESC="La hauteur des rang&eacute;es varie en fonction de la forme des images incluses, mais visera &agrave; se rapprocher du nombre saisi ici."
PLG_CONTENT_RC_GALLERY_THUMBQUALITY_LABEL="Qualit&eacute; des miniatures (0 - 100)"
PLG_CONTENT_RC_GALLERY_THUMBQUALITY_DESC="Qualit&eacute; d'image pour les miniatures. 100 donne la qualit&eacute; maximale possible, mais une taille de fichier plus &eacute;lev&eacute;e. Diminuez cette valeur pour r&eacute;duire la taille des fichiers miniatures. Notez que vous pouvez recr&eacute;er les miniatures en les supprimant via votre client FTP ou le gestionnaire de m&eacute;dias Joomla. Consultez le guide utilisateur RC Gallery, disponible sur therichcourt.com pour plus d'informations."
PLG_CONTENT_RC_GALLERY_IMAGEMARGIN_LABEL="Taille des marges d'image"
PLG_CONTENT_RC_GALLERY_IMAGEMARGIN_DESC="Taille des marges d'image, en px."
PLG_CONTENT_RC_GALLERY_IMAGETITLE_LABEL="Titre de l'image"
PLG_CONTENT_RC_GALLERY_IMAGETITLE_DESC="Affiche le nom de fichier de l'image sur l'image. Notez que l'extension du fichier n'est pas affich&eacute;e, les underscores sont remplac&eacute;s par des espaces, et la premi&egrave;re lettre est forc&eacute;e en majuscule."
PLG_CONTENT_RC_GALLERY_IMAGETITLE_OPT_HIDE="Ne pas afficher les titres d'images"
PLG_CONTENT_RC_GALLERY_IMAGETITLE_OPT_HOVER="Afficher les titres uniquement au survol du curseur"
PLG_CONTENT_RC_GALLERY_IMAGETITLE_OPT_ALWAYS="Afficher les titres en permanence"
PLG_CONTENT_RC_GALLERY_USETITLEASALT_LABEL="Utiliser le titre comme attribut 'alt'"
PLG_CONTENT_RC_GALLERY_USETITLEASALT_DESC="Utilise le titre de l'image comme attribut 'alt' pour la miniature. Ceci est utile si vos images ont des titres descriptifs, mais si ce sont juste des noms comme 'DSC00023.JPG', c'est moins utile et vous pourriez vouloir d&eacute;sactiver cette option. Vous pouvez personnaliser vos titres d'images si vos noms de fichiers ne sont pas descriptifs. Consultez le guide pour plus de d&eacute;tails. Globalement, cette fonctionnalit&eacute; est bonne pour le SEO et l'accessibilit&eacute;, mais uniquement si vos titres d'images sont pertinents."
PLG_CONTENT_RC_GALLERY_USELABELSFILE_LABEL="Obtenir les titres depuis un fichier de labels"
PLG_CONTENT_RC_GALLERY_USELABELSFILE_DESC="Fonctionnalit&eacute; avanc&eacute;e - consultez le guide utilisateur sur www.TheRichCourt.com"

; Fieldset Shadowbox
PLG_CONTENT_RC_GALLERY_SHADOWBOXDESCRIPTION_LABEL="Shadowbox"
PLG_CONTENT_RC_GALLERY_SHADOWBOXDESCRIPTION_DESC="Choisissez le type de shadowbox &agrave; utiliser. Si vous en avez d&eacute;j&agrave; un que vous appr&eacute;ciez, vous pouvez l'utiliser en s&eacute;lectionnant 'Utiliser un autre shadowbox'. Cela ajoutera des liens rel='shadowbox[rc_gallery]' aux images, mais n'inclura pas la partie shadowbox de ce plugin, ce qui permettra &agrave; votre propre shadowbox de prendre le relais. Cette option est utile pour &eacute;viter les conflits avec votre plugin shadowbox existant."
PLG_CONTENT_RC_GALLERY_SHADOWBOXOPTION_LABEL="Shadowbox"
PLG_CONTENT_RC_GALLERY_SHADOWBOXOPTION_DESC="S&eacute;lectionnez le type de shadowbox &agrave; utiliser avec la galerie."
PLG_CONTENT_RC_GALLERY_SHADOWBOXOPTION_OPT_BUILTIN="Utiliser le shadowbox int&eacute;gr&eacute; (Recommand&eacute;)"
PLG_CONTENT_RC_GALLERY_SHADOWBOXOPTION_OPT_LEGACY="Utiliser l'ancien shadowbox"
PLG_CONTENT_RC_GALLERY_SHADOWBOXOPTION_OPT_ANOTHER="Utiliser un autre shadowbox"
PLG_CONTENT_RC_GALLERY_SHADOWBOXOPTION_OPT_NONE="Pas de shadowbox"
PLG_CONTENT_RC_GALLERY_HIDESCROLLBAR_LABEL="Emp&ecirc;cher le d&eacute;filement"
PLG_CONTENT_RC_GALLERY_HIDESCROLLBAR_DESC="Vous pouvez emp&ecirc;cher le d&eacute;filement de la page lorsque le shadowbox est ouvert. Cela masque la barre de d&eacute;filement, ce qui dans certains navigateurs rend le contenu l&eacute;g&egrave;rement plus large et semble le d&eacute;caler de gauche &agrave; droite."
PLG_CONTENT_RC_GALLERY_HIDESCROLLBAR_OPT_ALLOW="Autoriser le d&eacute;filement"
PLG_CONTENT_RC_GALLERY_HIDESCROLLBAR_OPT_PREVENT="Emp&ecirc;cher le d&eacute;filement (masque la barre de d&eacute;filement, ce qui peut d&eacute;caler le contenu)"
PLG_CONTENT_RC_GALLERY_SHADOWBOXANIMATIONS_LABEL="Animations de transition"
PLG_CONTENT_RC_GALLERY_SHADOWBOXANIMATIONS_DESC="Choisissez le type d'animation de transition lors du passage entre les images dans le shadowbox (ne s'applique pas &agrave; l'ancien shadowbox)"

; Fieldset Apparence - Miniatures de la galerie
PLG_CONTENT_RC_GALLERY_THUMBNAILS_NOTE_LABEL="Miniatures de la galerie"
PLG_CONTENT_RC_GALLERY_THUMBNAILS_NOTE_DESC="Personnalisez certains &eacute;l&eacute;ments pour les adapter &agrave; votre site."
PLG_CONTENT_RC_GALLERY_THUMBBGCOLOUR_LABEL="Couleur d'arri&egrave;re-plan des miniatures"
PLG_CONTENT_RC_GALLERY_THUMBBGCOLOUR_DESC="La couleur des miniatures d'images pendant le chargement des images."
PLG_CONTENT_RC_GALLERY_TITLETEXTCOLOUR_LABEL="Couleur du titre de l'image"
PLG_CONTENT_RC_GALLERY_TITLETEXTCOLOUR_DESC="La couleur des titres d'images (notez que les titres d'images doivent &ecirc;tre activ&eacute;s dans les param&egrave;tres de la galerie pour que cela s'applique)."
PLG_CONTENT_RC_GALLERY_TITLETEXTSIZE_LABEL="Taille du texte du titre (px)"
PLG_CONTENT_RC_GALLERY_TITLETEXTSIZE_DESC="D&eacute;finissez la taille du texte du titre sur les miniatures. 14px par d&eacute;faut."
PLG_CONTENT_RC_GALLERY_TITLETEXTWEIGHT_LABEL="Graisse du texte du titre"
PLG_CONTENT_RC_GALLERY_TITLETEXTWEIGHT_DESC="Graisse du texte du titre &agrave; l'int&eacute;rieur des miniatures."
PLG_CONTENT_RC_GALLERY_TITLETEXTWEIGHT_OPT_BOLD="Gras"
PLG_CONTENT_RC_GALLERY_TITLETEXTWEIGHT_OPT_NORMAL="Normal"
PLG_CONTENT_RC_GALLERY_TITLETEXTALIGN_LABEL="Alignement du texte du titre"
PLG_CONTENT_RC_GALLERY_TITLETEXTALIGN_DESC="Alignez le texte du titre dans la miniature de l'image. Notez que si le d&eacute;bordement est d&eacute;fini sur masqu&eacute; et ce param&egrave;tre sur centr&eacute;, le texte semblera align&eacute; &agrave; gauche s'il est plus large que la miniature."
PLG_CONTENT_RC_GALLERY_TITLETEXTOVERFLOW_LABEL="D&eacute;bordement du texte du titre"
PLG_CONTENT_RC_GALLERY_TITLETEXTOVERFLOW_DESC="Que faire si le texte du titre est plus large que la miniature."
PLG_CONTENT_RC_GALLERY_TITLETEXTOVERFLOW_OPT_HIDDEN="Masqu&eacute;"
PLG_CONTENT_RC_GALLERY_TITLETEXTOVERFLOW_OPT_AUTO="Automatique"
PLG_CONTENT_RC_GALLERY_THUMBNAILRADIUS_LABEL="Rayon des coins des miniatures (px)"
PLG_CONTENT_RC_GALLERY_THUMBNAILRADIUS_DESC="Arrondissez les coins des miniatures. 3px fonctionne tr&egrave;s bien pour un look propre et moderne. Ou utilisez un rayon &eacute;norme pour des miniatures en forme de bulles. Entrez 0 pour des coins carr&eacute;s normaux."
PLG_CONTENT_RC_GALLERY_THUMBNAILFILTER_LABEL="Filtre des miniatures"
PLG_CONTENT_RC_GALLERY_THUMBNAILFILTER_DESC="Appliquez un filtre aux miniatures de votre galerie. Ce filtre est retir&eacute; avec une transition fluide lorsque la souris survole la miniature, r&eacute;v&eacute;lant les vraies couleurs. Notez que le filtre de miniature ne fonctionnera que sur les navigateurs modernes (pas Internet Explorer). Les utilisateurs d'IE verront les images en couleurs."
PLG_CONTENT_RC_GALLERY_THUMBNAILFILTER_OPT_NONE="Pas de filtre"
PLG_CONTENT_RC_GALLERY_THUMBNAILFILTER_OPT_SEPIA="S&eacute;pia"
PLG_CONTENT_RC_GALLERY_THUMBNAILFILTER_OPT_GREYSCALE="Niveaux de gris (Noir et Blanc)"

; Fieldset Apparence - Shadowbox
PLG_CONTENT_RC_GALLERY_SHADOWBOX_APPEARANCE_NOTE_LABEL="Shadowbox"
PLG_CONTENT_RC_GALLERY_SHADOWBOX_APPEARANCE_NOTE_DESC="Les param&egrave;tres ci-dessous ne s'appliquent que si vous utilisez le shadowbox int&eacute;gr&eacute; (activ&eacute; par d&eacute;faut)."
PLG_CONTENT_RC_GALLERY_SHADOWBOXTITLE_LABEL="Titres des images"
PLG_CONTENT_RC_GALLERY_SHADOWBOXTITLE_DESC="Afficher ou masquer les titres des images dans le shadowbox. 'Masquage automatique' fait appara&icirc;tre le titre au mouvement de la souris, puis le fait dispara&icirc;tre en cas d'inactivit&eacute;."
PLG_CONTENT_RC_GALLERY_SHADOWBOXTITLE_OPT_SHOW="Afficher"
PLG_CONTENT_RC_GALLERY_SHADOWBOXTITLE_OPT_HIDE="Masquer"
PLG_CONTENT_RC_GALLERY_OVERLAYCOLOUR_LABEL="Couleur de la superposition"
PLG_CONTENT_RC_GALLERY_OVERLAYCOLOUR_DESC="La couleur utilis&eacute;e pour couvrir le reste du site lorsque le shadowbox est ouvert. Notez que cette couleur sera affect&eacute;e par le r&eacute;glage d'opacit&eacute;."
PLG_CONTENT_RC_GALLERY_OVERLAYOPACITY_LABEL="Opacit&eacute; de la superposition"
PLG_CONTENT_RC_GALLERY_OVERLAYOPACITY_DESC="L'opacit&eacute; de la couleur utilis&eacute;e pour couvrir le reste du site lorsque le shadowbox est ouvert."
PLG_CONTENT_RC_GALLERY_OVERLAYBLUR_LABEL="Rayon de flou de la superposition (px)"
PLG_CONTENT_RC_GALLERY_OVERLAYBLUR_DESC="Le rayon de flou backdrop-filter en pixels. Notez que cette fonctionnalit&eacute; n'est pas prise en charge par tous les navigateurs, vous pourriez donc ne pas voir de flou du tout dans certains navigateurs."

; Fieldset Modules compl&eacute;mentaires
PLG_CONTENT_RC_GALLERY_ADDONSLINK_LABEL="Modules compl&eacute;mentaires"
PLG_CONTENT_RC_GALLERY_ADDONSLINK_DESC="Les modules compl&eacute;mentaires sont un excellent moyen d'&eacute;tendre les fonctionnalit&eacute;s du plugin de galerie principal. D&eacute;couvrez ce qui est actuellement disponible... http://therichcourt.com/joomla/gallery#add-ons"

