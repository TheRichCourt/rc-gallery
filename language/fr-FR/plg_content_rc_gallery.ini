PLG_CONTENT_RC_GALLERY_USERGUIDE_LABEL="Guide utilisateur"
PLG_CONTENT_RC_GALLERY_USERGUIDE_DESC="Un guide utilisateur gratuit et complet est disponible pour ce plugin, sur http://www.therichcourt.com/joomla/gallery/download"
PLG_CONTENT_RC_GALLERY_SUPPORT_LABEL="Support"
PLG_CONTENT_RC_GALLERY_SUPPORT_DESC="Si vous ne trouvez pas ce dont vous avez besoin, n'h&eacute;sitez pas &agrave; me contacter pour obtenir de l'aide, sur http://www.therichcourt.com/support"

; Fieldset Avanc&eacute;
PLG_CONTENT_RC_GALLERY_ADVANCED_NOTE_LABEL="Fonctionnalit&eacute; avanc&eacute;e"
PLG_CONTENT_RC_GALLERY_ADVANCED_NOTE_DESC="Si vous utilisez de grandes galeries, la production de toutes les miniatures peut prendre beaucoup de temps. Cela ne se produit que lors de la premi&egrave;re visite d'une page, mais ce n'est toujours pas id&eacute;al. En fait, si vous avez suffisamment d'images, la requ&ecirc;te HTTP expirera pendant que votre serveur cr&eacute;e encore les miniatures. Le r&eacute;sultat est que le visiteur verra une erreur. Vous pouvez contourner cela de deux mani&egrave;res diff&eacute;rentes."
PLG_CONTENT_RC_GALLERY_ADVANCED_NOTE1_LABEL="1"
PLG_CONTENT_RC_GALLERY_ADVANCED_NOTE1_DESC="1. Rechargez la page plusieurs fois - &agrave; chaque rechargement, le processus avance un peu plus, et apr&egrave;s quelques essais la page fonctionnera toujours correctement."
PLG_CONTENT_RC_GALLERY_ADVANCED_NOTE2_LABEL="2"
PLG_CONTENT_RC_GALLERY_ADVANCED_NOTE2_DESC="2. Activez ce param&egrave;tre. Cependant, il y a aussi un probl&egrave;me potentiel. Ce param&egrave;tre enverra une requ&ecirc;te AJAX pour chaque image, afin de produire les miniatures de mani&egrave;re asynchrone. Cependant, certains serveurs consid&eacute;reront ce grand nombre de requ&ecirc;tes similaires comme une attaque possible et les bloqueront. Activez donc cette option &agrave; vos risques et p&eacute;rils ! Si cela fonctionne sur votre serveur, c'est d&eacute;finitivement la meilleure option."
PLG_CONTENT_RC_GALLERY_AJAXIMAGES_LABEL="Activer les images AJAX"
PLG_CONTENT_RC_GALLERY_AJAXIMAGES_DESC="Voir la note ci-dessus"

